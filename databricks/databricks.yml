bundle:
  name: realtime-market-data-lakehouse

sync:
  paths:
    - ../notebooks
    - ../src  # needed for 02_silver_transform.py
  
resources:
  jobs:
    medallion_open:
      name: market-data-pipeline-open
      schedule:
        quartz_cron_expression: "0 30,40,50 9 ? * MON-FRI"
        timezone_id: "America/New_York"
      tasks: &pipeline_tasks
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py

        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver_transform.py

        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/03_gold_aggregate.py

    medallion_midday:
      name: market-data-pipeline-midday
      schedule:
        quartz_cron_expression: "0 0/10 10-15 ? * MON-FRI"
        timezone_id: "America/New_York"
      tasks: *pipeline_tasks

    medallion_close:
      name: market-data-pipeline-close
      schedule:
        quartz_cron_expression: "0 0 16 ? * MON-FRI"
        timezone_id: "America/New_York"
      tasks: *pipeline_tasks